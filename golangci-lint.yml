version: "2"

run:
  timeout: 10m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - bodyclose
    - gocritic
    - misspell
    - unconvert
    - staticcheck

  settings:  
    staticcheck:
      checks:
        - "all"
        # Disable ST1000 - Package comment check
        # This allows packages without top-level documentation comments
        - "-ST1000"

formatters:
  enable:
    - goimports
