---
name: go test

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          unformatted=$(gofmt -l ./pkg)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet -mod=mod ./...

      # -mod=mod because a stale local vendor/ directory must not decide what CI
      # compiles against; dependencies here are all public, so no auth is needed.
      - name: Test
        run: go test -mod=mod -count=1 -race ./...
